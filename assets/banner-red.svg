<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="50%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#1f2233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7768e"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ff4d4d"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      @keyframes flowRight { from { transform: translateX(0); } to { transform: translateX(260px); } }
      @keyframes flowRightLong { from { transform: translateX(0); } to { transform: translateX(340px); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      @keyframes nodeGlow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
      .dot1 { animation: flowRight 2.2s linear infinite; }
      .dot2 { animation: flowRight 2.2s linear infinite; animation-delay: 0.7s; }
      .dot3 { animation: flowRight 2.2s linear infinite; animation-delay: 1.4s; }
      .dot4 { animation: flowRightLong 3s linear infinite; }
      .dot5 { animation: flowRightLong 3s linear infinite; animation-delay: 1s; }
      .dot6 { animation: flowRightLong 3s linear infinite; animation-delay: 2s; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .pl { animation: pulse 3s ease-in-out infinite; }
      .nd { animation: nodeGlow 2.5s ease-in-out infinite; }
      .nd2 { animation: nodeGlow 2.5s ease-in-out infinite; animation-delay: 0.8s; }
      .nd3 { animation: nodeGlow 2.5s ease-in-out infinite; animation-delay: 1.6s; }
    </style>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#2f334d" stroke-width="2"/>

  <!-- Grille discrète -->
  <g stroke="#24283b" stroke-width="1" opacity="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- ═══ PIPELINE DE DONNÉES (côté droit) ═══ -->
  <g transform="translate(760, 0)">
    <!-- Noeud source -->
    <g class="nd">
      <rect x="40" y="88" width="84" height="40" rx="8" fill="#1f2335" stroke="#f7768e" stroke-width="1.5"/>
      <text x="82" y="113" text-anchor="middle" class="mono" font-size="13" fill="#f7768e">sources</text>
    </g>
    <!-- Noeud transform -->
    <g class="nd2">
      <rect x="180" y="88" width="84" height="40" rx="8" fill="#1f2335" stroke="#ff4d4d" stroke-width="1.5"/>
      <text x="222" y="113" text-anchor="middle" class="mono" font-size="13" fill="#ff4d4d">ETL</text>
    </g>
    <!-- Noeud warehouse -->
    <g class="nd3">
      <rect x="320" y="88" width="84" height="40" rx="8" fill="#1f2335" stroke="#9ece6a" stroke-width="1.5"/>
      <text x="362" y="113" text-anchor="middle" class="mono" font-size="13" fill="#9ece6a">analytics</text>
    </g>

    <!-- Tuyaux -->
    <line x1="124" y1="108" x2="180" y2="108" stroke="#3b4261" stroke-width="2"/>
    <line x1="264" y1="108" x2="320" y2="108" stroke="#3b4261" stroke-width="2"/>

    <!-- Particules pipeline haut -->
    <g>
      <circle class="dot1" cx="124" cy="108" r="3.5" fill="#f7768e" filter="url(#glow)"/>
      <circle class="dot2" cx="124" cy="108" r="3.5" fill="#ff4d4d" filter="url(#glow)"/>
      <circle class="dot3" cx="124" cy="108" r="3.5" fill="#9ece6a" filter="url(#glow)"/>
    </g>

    <!-- Flux de données bas (ligne libre) -->
    <line x1="40" y1="200" x2="404" y2="200" stroke="url(#pipe)" stroke-width="2" class="pl"/>
    <g>
      <circle class="dot4" cx="40" cy="200" r="3" fill="#f7768e" filter="url(#glow)"/>
      <circle class="dot5" cx="40" cy="200" r="3" fill="#dc2626" filter="url(#glow)"/>
      <circle class="dot6" cx="40" cy="200" r="3" fill="#ff4d4d" filter="url(#glow)"/>
    </g>

    <!-- Labels data -->
    <text x="40" y="232" class="mono" font-size="11" fill="#565f89">stream: events.passages →  dashboard.kpi</text>
  </g>

  <!-- ═══ TEXTE PRINCIPAL (côté gauche) ═══ -->
  <!-- Prompt terminal -->
  <text x="64" y="86" class="mono" font-size="15" fill="#565f89">~/sajedd $ <tspan fill="#9ece6a">whoami</tspan></text>

  <!-- Nom -->
  <text x="64" y="148" class="sans" font-size="46" font-weight="800" fill="#c0caf5" letter-spacing="1">SAJED BEN YOUSSEF</text>

  <!-- Titre avec dégradé -->
  <text x="64" y="192" class="mono" font-size="24" font-weight="600" fill="url(#accent)">&gt; Data Engineer<tspan class="cursor" fill="#dc2626">_</tspan></text>

  <!-- Ligne séparatrice -->
  <line x1="64" y1="218" x2="640" y2="218" stroke="#2f334d" stroke-width="1.5"/>

  <!-- Badge alternance -->
  <g transform="translate(64, 238)">
    <rect width="320" height="36" rx="18" fill="#1f2335" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="22" cy="18" r="5" fill="#9ece6a" class="pl"/>
    <text x="38" y="23" class="mono" font-size="13.5" fill="#c0caf5">Alternance · Sept. 2026 · Île-de-France</text>
  </g>

  <!-- Tags stack -->
  <g class="mono" font-size="12.5">
    <text x="412" y="261" fill="#f7768e">#Python</text>
    <text x="486" y="261" fill="#ff4d4d">#SQL</text>
    <text x="534" y="261" fill="#ff9e64">#GCP</text>
    <text x="584" y="261" fill="#9ece6a">#Pipelines</text>
  </g>
</svg>
